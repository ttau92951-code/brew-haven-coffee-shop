# Brew Haven - Render Blueprint (Infrastructure as Code)
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repository.
# The API is hosted as a Node web service and connects to Upstash Redis.

services:
  - type: web
    name: brew-haven-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Set these in the Render dashboard (marked as secret, not stored in Git).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STAFF_USERNAME
        sync: false
      - key: STAFF_PASSWORD_HASH
        sync: false
      # Deployed frontend origin used for CORS.
      - key: FRONTEND_URL
        sync: false
