# Brew Haven - Netlify configuration
# Set the Netlify "Base directory" to "frontend" when deploying this repository.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application fallback: all routes are handled by React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
